<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pokémon Champions{% endblock %}</title>
    <!-- Keeping Bootstrap for grid/utility resets, but our CSS will override the core themes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body class="site-body">
    
    <!-- Elite Arena Navigation Bar -->
    <nav class="navbar navbar-expand-lg arena-navbar">
      <div class="container">
        <a class="navbar-brand arena-brand" href="{{ url_for('main.index') }}">
          <span class="brand-accent">POKÉMON</span> CHAMPIONS
        </a>
        
        <!-- Toggle button for mobile responsiveness -->
        <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#arenaNavbar" aria-controls="arenaNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="arenaNavbar">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link arena-link active" href="{{ url_for('main.index') }}">Champions Home</a>
            </li>
            <!-- You can easily append more links here later, like /pokedex or /teams -->
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content Stage Area -->
    <main class="container stage-container py-5">
      {% block content %}{% endblock %}
    </main>

  </body>
</html>
